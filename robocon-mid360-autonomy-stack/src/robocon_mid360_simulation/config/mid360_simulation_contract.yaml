mid360_input_guard:
  ros__parameters:
    lidar_topic: /livox/lidar
    imu_topic: /livox/imu
    input_valid_topic: /mid360/input_valid
    diagnostic_topic: /mid360/input_diagnostics
    minimum_points: 1
    max_lidar_silence_sec: 0.50
    max_imu_silence_sec: 0.50
    status_publish_hz: 10.0

mid360_pose_bridge:
  ros__parameters:
    source_odom_topic: /Odometry
    output_odom_topic: /mid360/local_odometry
    pose_valid_topic: /mid360/pose_valid
    diagnostic_topic: /mid360/pose_diagnostics
    source_odom_frame: camera_init
    odom_frame: odom
    base_frame: base_link
    source_tracking_frame: body
    strict_source_frames: true
    base_to_tracking_translation_m: [0.0, 0.0, 0.40]
    base_to_tracking_rpy_rad: [0.0, 0.0, 0.0]
    max_pose_silence_sec: 0.50
    max_position_step_m: 0.0
    max_linear_speed_mps: 0.0
    max_yaw_rate_radps: 0.0
    max_abs_z_m: 0.0
    status_publish_hz: 10.0

mid360_map_odom_anchor:
  ros__parameters:
    odom_topic: /mid360/local_odometry
    initialpose_topic: /initialpose
    correction_topic: /mid360/map_to_odom_correction
    localized_odom_topic: /mid360/localization_odometry
    map_locked_topic: /mid360/map_locked
    diagnostic_topic: /mid360/localization_diagnostics
    pose_status_topic: /mid360/pose_status
    pose_diagnostic_topic: /mid360/pose_diagnostics
    input_diagnostic_topic: /mid360/input_diagnostics
    map_diagnostic_topic: /mid360/map_localization_diagnostics
    relocalization_request_topic: /mid360/relocalization_request
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    require_pose_valid: true
    pose_valid_topic: /mid360/pose_valid
    max_odom_silence_sec: 0.50
    tf_publish_hz: 20.0

mid360_static_sensor_frames:
  ros__parameters:
    enabled: false
    calibration_ready: false
    base_frame: base_link
    imu_frame: imu_link
    lidar_frame: lidar_mid360
    base_to_imu_translation_m: [0.0, 0.0, 0.40]
    base_to_imu_rpy_rad: [0.0, 0.0, 0.0]
    imu_to_lidar_translation_m: [0.0, 0.0, 0.0]
    imu_to_lidar_rpy_rad: [0.0, 0.0, 0.0]

mid360_preflight:
  ros__parameters:
    lidar_topic: /livox/lidar
    imu_topic: /livox/imu
    source_odom_topic: /Odometry
    canonical_odom_topic: /mid360/local_odometry
    input_valid_topic: /mid360/input_valid
    pose_valid_topic: /mid360/pose_valid
    map_locked_topic: /mid360/map_locked
    preflight_ready_topic: /mid360/preflight_ready
    diagnostic_topic: /mid360/preflight_diagnostics
    require_map_locked: true
    startup_grace_sec: 10.0
    max_odom_silence_sec: 0.50
    status_publish_hz: 2.0
