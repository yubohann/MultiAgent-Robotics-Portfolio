robocon_camera_yolo_adapter:
  ros__parameters:
    enabled: false
    legacy_module_path: TBD
    weights_path: TBD
    device: cpu
    use_berxel: true
    conf_thres: 0.60
    iou_thres: 0.45
    target_classes: [basket, hoop, backboard]
    observation_topic: /camera/target_observation
    status_topic: /camera/target_status
    diagnostic_topic: /camera/diagnostics
    publish_hz: 20.0
    observation_max_age_sec: 0.50
