[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aerocity-bench"
version = "0.2.0.dev0"
description = "Open benchmark for 3D multi-UAV search under urban topology, target-process, and fleet-resilience shifts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bohan Yu" }]
keywords = ["multi-uav", "drone-search", "robotics-benchmark", "3d-search", "multi-agent-systems", "isaac-sim"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yubohann/MultiAgent-Robotics-Portfolio/tree/main/aerocity-bench"
Upstream = "https://github.com/yubohann/AeroCityBench"

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8.0", "ruff>=0.6"]
release = ["usd-core>=25.5"]
rl = ["gymnasium>=1.0", "pettingzoo>=1.24"]

[project.scripts]
aerocity-bench = "aerocity_bench.cli:main"

[tool.hatch.build]
exclude = [
  "/dist/",
  "/ruff-fix-log.tsv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aerocity_bench"]

[tool.hatch.build.targets.wheel.force-include]
"configs/releases/ordinary-v1-mini.json" = "aerocity_bench/resources/presets/ordinary-v1-mini.json"
"schemas/release_config_ordinary_v3.schema.json" = "aerocity_bench/resources/schemas/release_config_ordinary_v3.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
