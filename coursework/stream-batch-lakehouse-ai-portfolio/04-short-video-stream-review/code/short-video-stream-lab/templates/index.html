<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
      FastAPI 渲染的单页 Demo。页面本身不包含业务数据，
      所有状态都由 static/app.js 调用 JSON API 后动态渲染。
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>短视频流智能审核发布 Demo</title>
    <!-- 查询参数用于课堂迭代时绕开浏览器缓存，确保同学刷新后拿到最新 CSS。 -->
    <link rel="stylesheet" href="/static/styles.css?v=20260524-model-gallery" />
  </head>
  <body>
    <!-- 顶部操作区：运行内置样本流或清空 SQLite 演示状态。 -->
    <header class="topbar">
      <div>
        <h1>短视频审核发布台</h1>
        <p>实时理解、审核、打标签、发布</p>
      </div>
      <div class="actions">
        <button id="runDemo" type="button">运行样本流</button>
        <button id="resetDemo" type="button" class="secondary">清空状态</button>
      </div>
    </header>

    <main class="layout">
      <!-- 状态概览：这些数字来自 /api/videos 的 stats 字段。 -->
      <section class="panel metrics" aria-label="状态概览">
        <div>
          <span class="label">全部</span>
          <strong id="totalCount">0</strong>
        </div>
        <div>
          <span class="label">已发布</span>
          <strong id="publishedCount">0</strong>
        </div>
        <div>
          <span class="label">复核</span>
          <strong id="reviewCount">0</strong>
        </div>
        <div>
          <span class="label">拒绝</span>
          <strong id="rejectedCount">0</strong>
        </div>
      </section>

      <!-- 上传表单：视频文件和标题会以 multipart/form-data 发送到 /api/upload。 -->
      <section class="panel upload-panel" aria-label="上传短视频">
        <form id="uploadForm">
          <input id="titleInput" name="title" type="text" placeholder="视频标题" />
          <input id="videoInput" name="video" type="file" accept="video/mp4,video/webm,video/quicktime" />
          <button type="submit">上传处理</button>
        </form>
        <span id="statusText" class="status-text">空闲</span>
      </section>

      <!-- 模型选择：候选项来自后端模型注册表，切换后写入 SQLite settings。 -->
      <section class="panel model-panel" aria-label="模型选择">
        <div>
          <label for="modelSelect">后台理解模型</label>
          <select id="modelSelect"></select>
        </div>
        <div id="modelDetails" class="model-details"></div>
        <div class="model-gallery-wrap">
          <div class="model-gallery-title">
            <strong>本实验模型工作量</strong>
            <span>主模型 + 两个主流视觉基线 + 规则兜底 + 备用候选</span>
          </div>
          <div id="modelGallery" class="model-gallery"></div>
        </div>
      </section>

      <!-- 前端筛选按钮：只过滤当前视频列表，不改变后端数据。 -->
      <section class="tabs" aria-label="视频筛选">
        <button class="tab active" data-filter="all" type="button">全部</button>
        <button class="tab" data-filter="published" type="button">已发布</button>
        <button class="tab" data-filter="review" type="button">待复核</button>
        <button class="tab" data-filter="rejected" type="button">已拒绝</button>
      </section>

      <!-- 视频卡片容器：JS 会复用已有 video 节点，避免轮询刷新打断播放。 -->
      <section id="videoGrid" class="video-grid" aria-live="polite"></section>

      <!-- 事件流面板：帮助同学观察 ingest、queued、worker、understanding、publish 等阶段。 -->
      <section class="panel event-panel">
        <div class="section-title">
          <h2>流处理事件</h2>
          <span id="processingBadge" class="badge">idle</span>
        </div>
        <ol id="eventList" class="event-list"></ol>
      </section>
    </main>

    <!-- 查询参数同样用于绕开 JS 缓存，尤其是修复播放器刷新问题后需要强制更新。 -->
    <script src="/static/app.js?v=20260524-model-gallery"></script>
  </body>
</html>
