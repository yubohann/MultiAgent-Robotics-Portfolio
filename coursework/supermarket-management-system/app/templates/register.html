<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 超市管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 transform scale-125">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">创建账号</h1>
            <p class="text-gray-600 text-sm">欢迎加入超市管理系统</p>
        </div>

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">
                    用户名
                </label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    required
                    autocomplete="off"
                    autofocus
                    placeholder="请输入用户名"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-200 text-sm"
                >
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1.5">
                    身份权限
                </label>
                <select
                    id="role"
                    name="role"
                    required
                    onchange="updateRoleHint()"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-200 text-sm bg-white"
                >
                    <option value="cashier" selected>收银员（无需审核）</option>
                    <option value="admin">管理员（需管理员审核）</option>
                </select>
                <p id="roleHint" class="mt-1.5 text-xs text-gray-500">收银员可直接注册成功并登录。</p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
                    密码
                </label>
                <div class="relative">
                    <input
                        id="password"
                        type="password"
                        name="password"
                        required
                        autocomplete="off"
                        placeholder="请输入密码"
                        class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-200 text-sm"
                    >
                    <button
                        type="button"
                        onclick="togglePassword('password', this)"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors duration-200"
                    >
                        {% from 'macros/icons.html' import icon_eye %}
                        {{ icon_eye() }}
                    </button>
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">
                    确认密码
                </label>
                <div class="relative">
                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        required
                        autocomplete="off"
                        placeholder="请再次输入密码"
                        class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-200 text-sm"
                    >
                    <button
                        type="button"
                        onclick="togglePassword('confirm_password', this)"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors duration-200"
                    >
                        {% from 'macros/icons.html' import icon_eye %}
                        {{ icon_eye() }}
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 text-sm"
            >
                立即注册
            </button>
        </form>

        <div class="mt-5 text-center space-y-2">
            <p class="text-gray-600 text-sm">
                已有账号？
                <a href="/login" class="text-blue-600 hover:text-blue-700 font-medium hover:underline">
                    去登录
                </a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth-register.js') }}"></script>
</body>
</html>
