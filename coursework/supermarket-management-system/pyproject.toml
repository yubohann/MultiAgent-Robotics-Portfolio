[project]
name = "supermarket-management-system"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.1",
    "coverage>=7.6.0",
    "pytest>=8.3.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app.models", "app.services.second_phase"]
omit = [
    "app/static/*",
    "app/templates/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
