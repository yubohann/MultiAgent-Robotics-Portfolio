[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "realised-qd"
version = "0.1.0"
description = "Outcome-grounded quality-diversity and reinforcement learning for target-free HM3D multi-UAV exploration"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Bohan Yu" }]
keywords = ["hm3d", "multi-uav", "quality-diversity", "reinforcement-learning", "3d-exploration", "multi-agent-systems", "isaaclab", "robotics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/yubohann/MultiAgent-Robotics-Portfolio/tree/main/hm3d-realised-qd"
Upstream = "https://github.com/yubohann/hm3d-realised-qd"

[project.optional-dependencies]
rl = ["torch>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/realised_qd"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/configs",
  "/docs",
  "/manifests",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "external",
  "reports",
  "results",
  "src/realised_qd/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
