[project]
name = "aerogategraph"
version = "0.1.0"
description = "2D graph reinforcement learning for dense and dynamic drone gate traversal (single-agent and 8-drone formation)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bohan Yu" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/yubohann/MultiAgent-Robotics-Portfolio"
Repository = "https://github.com/yubohann/MultiAgent-Robotics-Portfolio"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
# No console scripts yet; entry points are per-line scripts under scripts/ and <line>/scripts/.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
