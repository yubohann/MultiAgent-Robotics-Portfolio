name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build

      - name: Validate repository contract
        run: python scripts/validate_repository.py

      - name: Run structural tests
        run: python -m pytest

      - name: Compile source and scripts
        run: python -m compileall -q src scripts tests

      - name: Build source distribution and wheel
        run: python -m build

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m fraud_ml_engineering --help
