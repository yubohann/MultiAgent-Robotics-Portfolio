[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgraph-ml-engineering"
version = "0.1.0"
description = "Reproducible graph-and-sequence fraud detection experiments across financial transaction datasets."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Yu Bo Han" }]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "PyYAML==6.0.2",
  "tqdm==4.67.1",
  "tensorboard==2.19.0",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
  "requests==2.32.3",
  "psutil==7.0.0",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
cpu = ["torch==2.3.1", "torchdata==0.7.1", "dgl==2.2.1"]
cu121 = ["torch==2.3.1", "torchvision==0.18.1", "torchaudio==2.3.1", "torchdata==0.7.1", "dgl==2.2.1+cu121"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
fraud-ml-train = "fraud_ml_engineering.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/fraud_ml_engineering/vendor"]
