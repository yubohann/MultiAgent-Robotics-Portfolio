name: Portfolio integrity

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "coursework/machine-learning/**"
      - "tools/verify_portfolio.py"
      - ".github/workflows/portfolio-integrity.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "coursework/machine-learning/**"
      - "tools/verify_portfolio.py"
      - ".github/workflows/portfolio-integrity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_portfolio.py
