name: RoboCup core checks

on:
  push:
    paths:
      - "robocup-cbg-wm/**"
      - ".github/workflows/robocup-core-checks.yml"
  pull_request:
    paths:
      - "robocup-cbg-wm/**"
      - ".github/workflows/robocup-core-checks.yml"

jobs:
  rule-environment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robocup-cbg-wm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - run: python isaaclab_sim/rl/evaluate_selfplay.py --episodes 2 --max-steps 8 --output "$RUNNER_TEMP/selfplay-smoke.json"
