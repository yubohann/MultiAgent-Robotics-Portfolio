name: MID-360 contract checks

on:
  push:
    paths:
      - "robocon-mid360-autonomy-stack/**"
      - ".github/workflows/mid360-contract-checks.yml"
  pull_request:
    paths:
      - "robocon-mid360-autonomy-stack/**"
      - ".github/workflows/mid360-contract-checks.yml"

jobs:
  contracts:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: robocon-mid360-autonomy-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: python tools/run_python_contract_tests.py
      - run: python tools/validate_project.py
