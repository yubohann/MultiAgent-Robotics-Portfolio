[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivermark-benchmark"
version = "0.1.0.dev0"
description = "Auditable native Isaac Sim multi-UAV embodied-search capture tooling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
demo = ["opencv-python>=4.8", "imageio-ffmpeg>=0.6"]
sb3 = ["gymnasium>=1.0", "stable-baselines3>=2.7"]
torch = ["torch>=2.0"]
qd = ["ribs==0.8.3"]
zarr = ["zarr>=2.17,<3"]
parquet = ["pyarrow==25.0.0"]
cpu-ci = [
  "build>=1.2,<2",
  "cryptography>=42,<47",
  "jsonschema>=4.20",
  "pyarrow==25.0.0",
  "pytest>=8.0",
  "ruff==0.16.0",
  "setuptools>=68",
  "zarr>=2.17,<3",
]
marl = ["gymnasium>=1.0", "pettingzoo>=1.26", "torch>=2.0"]
supply-chain = ["cryptography>=42,<47", "cyclonedx-bom>=7.3.1,<8"]
pilot-all = [
  "opencv-python>=4.8",
  "imageio-ffmpeg>=0.6",
  "pytest>=8.0",
  "gymnasium>=1.0",
  "stable-baselines3>=2.7",
  "torch>=2.0",
  "ribs==0.8.3",
  "pettingzoo>=1.26",
  "cryptography>=42,<47",
  "jsonschema>=4.20",
]

[project.scripts]
rivermark-validate = "rivermark_benchmark.audit.validate:main"
rivermark-methods = "rivermark_benchmark.train.methods:main"
rivermark-train = "rivermark_benchmark.train.train:main"
rivermark-collect = "rivermark_benchmark.data.dataset:main"
rivermark-dataset = "rivermark_benchmark.audit.formal_dataset:main"
rivermark-torch-train = "rivermark_benchmark.train.torch_train:main"
rivermark-qd-train = "rivermark_benchmark.train.qd_train:main"
rivermark-marl-train = "rivermark_benchmark.train.marl:main"
rivermark-video = "rivermark_benchmark.ops.video:main"
rivermark-isaac-capture = "rivermark_benchmark.isaac.isaac_capture:main"
rivermark-isaac-validate = "rivermark_benchmark.audit.isaac_validate:main"
rivermark-isaac-pack = "rivermark_benchmark.pack.isaac_pack:main"
rivermark-isaac-pack-readiness = "rivermark_benchmark.pack.isaac_pack_readiness:main"
rivermark-isaac-pack-descriptor = "rivermark_benchmark.pack.isaac_pack_descriptor:main"
rivermark-isaac-pack-spec = "rivermark_benchmark.pack.isaac_pack_spec:main"
rivermark-isaac-evidence = "rivermark_benchmark.isaac.isaac_evidence:main"
rivermark-release-data = "rivermark_benchmark.audit.release_manifest:main"
rivermark-metrics = "rivermark_benchmark.score.metrics:main"
rivermark-evaluate = "rivermark_benchmark.score.evaluator:main"
rivermark-fixture = "rivermark_benchmark.data.fixture:main"
rivermark-researcher-smoke = "rivermark_benchmark.researcher_entry:main"
rivermark-failure-ledger = "rivermark_benchmark.runtime.failure_ledger:main"
rivermark-recover-captures = "rivermark_benchmark.runtime.failure_ledger:recovery_main"
rivermark-supply-chain = "rivermark_benchmark.audit.supply_chain:main"
rivermark-coverage = "rivermark_benchmark.collection_protocol:main"
rivermark-preflight = "rivermark_benchmark.runtime.preflight:main"
rivermark-cleanup = "rivermark_benchmark.ops.cleanup_history:main"
rivermark-audit-repository = "rivermark_benchmark.audit.repository_audit:main"
rivermark-zarr = "rivermark_benchmark.data.research_projection:main"
rivermark-parquet = "rivermark_benchmark.data.parquet_projection:main"
rivermark-rlds = "rivermark_benchmark.data.rlds_projection:main"
rivermark-runtime-lock = "rivermark_benchmark.runtime.runtime_lock:main"
rivermark-isaac-smoke = "rivermark_benchmark.isaac.isaac_smoke:main"
rivermark-isaac-geometry-scan = "rivermark_benchmark.isaac.isaac_geometry_scan:main"
rivermark-asset-provenance = "rivermark_benchmark.ops.asset_provenance:main"
rivermark-baseline = "rivermark_benchmark.score.baseline_harness:main"
rivermark-release-readiness = "rivermark_benchmark.audit.release_readiness:main"
rivermark-labels = "rivermark_benchmark.data.labels:main"
rivermark-target-visibility-diagnosis = "rivermark_benchmark.score.target_visibility_diagnosis:main"
rivermark-policy-projection = "rivermark_benchmark.data.policy_projection:main"
rivermark-repeatability = "rivermark_benchmark.score.repeatability:main"
rivermark-cohort-audit = "rivermark_benchmark.audit.cohort_audit:main"
rivermark-open-aoe = "rivermark_benchmark.ops.open_aoe:main"
rivermark-lerobot = "rivermark_benchmark.data.lerobot_projection:main"
rivermark-cf2x-calibrate = "rivermark_benchmark.isaac.cf2x_runtime_calibration:main"
rivermark-cpu-tests = "rivermark_benchmark.ops.cpu_test_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# archived/ keeps historical modules exactly as they were retired; it is
# not part of the package or the release tree and is intentionally left unlinted.
extend-exclude = ["archived"]

# Evidence and audit tooling keeps deliberate broad `except Exception` guards:
# these modules turn third-party, simulator, and filesystem failures into a
# recorded diagnostic or a strict report instead of aborting the run or
# masking the original failure.  They are not part of the core runtime.
[tool.ruff.lint.per-file-ignores]
"src/rivermark_benchmark/score/baseline_harness.py" = ["BLE001"]
"src/rivermark_benchmark/audit/formal_dataset.py" = ["BLE001"]
"src/rivermark_benchmark/isaac/isaac_capture.py" = ["BLE001"]
"src/rivermark_benchmark/isaac/isaac_smoke.py" = ["BLE001"]
"src/rivermark_benchmark/audit/release_readiness.py" = ["BLE001"]
"src/rivermark_benchmark/audit/validate.py" = ["BLE001"]
